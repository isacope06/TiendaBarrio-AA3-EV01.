<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Tienda Barrio</title>
</head>

<body>

<h1>Registro de Productos</h1>

<div th:if="${mensaje == 'guardado'}">

    <p style="color: green;">
        Producto guardado correctamente
    </p>

</div>

<div th:if="${mensaje == 'eliminado'}">

    <p style="color: red;">
        Producto eliminado correctamente
    </p>

</div>

<!-- Formulario para guardar productos -->
<form th:action="@{/guardar}" method="post">

    <label>Nombre:</label>
    <input type="text"
           name="nombre"
           required>

    <br><br>

    <label>Precio:</label>
    <input type="number"
           step="0.01"
           name="precio"
           required>

    <br><br>

    <label>Cantidad:</label>
    <input type="number"
           name="cantidad"
           required>

    <br><br>

    <button type="submit">
        Guardar Producto
    </button>

</form>

<hr>

<h2>Lista de Productos</h2>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Cantidad</th>
        <th>Acciones</th>
    </tr>

    <!-- Recorrer lista de productos -->
    <tr th:each="producto : ${lista}">

        <td th:text="${producto.id}"></td>

        <td th:text="${producto.nombre}"></td>

        <td th:text="${producto.precio}"></td>

        <td th:text="${producto.cantidad}"></td>
        <td>

            <a th:href="@{/eliminar/{id}(id=${producto.id})}">
                Eliminar
            </a>

        </td>

    </tr>

</table>

</body>
</html>
